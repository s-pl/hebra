name: Git interop

# Real repositories from GitHub, imported into Hebra and exported back: every
# commit must come out with the very same Git tree. Weekly, on demand, and
# whenever the Git bridge changes.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories (owner/name, space separated); empty for the default set"
        required: false
        default: ""
  pull_request:
    paths:
      - "crates/core/src/gitimport.rs"
      - "crates/core/src/gitexport.rs"
      - "crates/core/src/store.rs"
      - "crates/core/src/wc.rs"
      - "scripts/github-roundtrip.sh"
      - ".github/workflows/interop.yml"

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  roundtrip:
    name: Round trip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p hebra-cli
      - name: Import, export and compare every tree
        env:
          REPOS: ${{ inputs.repos }}
        # REPOS is split into arguments on purpose.
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          scripts/github-roundtrip.sh $REPOS | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
