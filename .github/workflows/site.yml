name: Site

# Publishes the landing, the docs and the demo hub to GitHub Pages on every push
# to main that touches them. The hub is a static snapshot of scripts/demo.sh.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/demo.sh"
      - "scripts/static-preview.mjs"
      - "scripts/static-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cut a deployment off half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the exact toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Installs the pnpm version from packageManager in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked -p hebra-cli -p hebra-server
      - run: scripts/static-site.sh _site /hebra
        env:
          NEXT_PUBLIC_SITE_URL: https://s-pl.github.io/hebra
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
