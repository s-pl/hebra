[package]
name = "hebra-server"
description = "Hebra server: hosts repositories, push/pull, presence and per-agent permissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hebra-server"
path = "src/main.rs"

[features]
default = ["s3"]
# Objects in S3-compatible storage (AWS S3, MinIO, R2, GCS interop).
s3 = ["dep:object_store"]

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
axum.workspace = true
axum-server.workspace = true
biscuit-auth.workspace = true
blake3.workspace = true
clap.workspace = true
futures-util.workspace = true
hebra-core.workspace = true
hebra-mandate.workspace = true
hex.workspace = true
jiff.workspace = true
object_store = { workspace = true, optional = true }
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
toml.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
