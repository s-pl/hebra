[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/s-pl/hebra"
homepage = "https://hebra.dev"

[workspace.dependencies]
hebra-core = { path = "crates/core", version = "0.1.0" }
hebra-server = { path = "crates/server", version = "0.1.0" }
hebra-mandate = { path = "crates/mandate", version = "0.1.0" }
anyhow = "1.0.104"
async-nats = { version = "0.50.0", default-features = false, features = ["ring", "jetstream", "nkeys"] }
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro"] }
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
diffy = "0.5.2"
# Same major version biscuit-auth uses.
ed25519-dalek = "2.2.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
ignore = "0.4.33"
jiff = "0.2.38"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# 0.39: shares libsqlite3-sys with sqlx-sqlite (one SQLite in the binary).
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hmac = "0.13.0"
toml = "1.1.8"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite", "any"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout", "set-header", "compression-gzip", "limit"] }
tracing = "0.1.44"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.4.2", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
