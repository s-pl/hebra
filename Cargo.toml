[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/s-pl/hebra"
homepage = "https://hebra.dev"

[workspace.dependencies]
hebra-core = { path = "crates/core", version = "0.1.0" }
hebra-server = { path = "crates/server", version = "0.1.0" }
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
diffy = "0.5.2"
hex = "0.4.3"
ignore = "0.4.33"
jiff = "0.2.38"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ureq = { version = "3.4.2", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
