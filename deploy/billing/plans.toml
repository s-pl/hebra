# Hebra Cloud plans. The server loads this file when HEBRA_EDITION=cloud
# (HEBRA_BILLING_PLANS=path); the web pricing page reads the same data from
# GET /api/v1/plans. Prices in US cents. Keep it in sync with
# docs/billing-policy.md.

currency = "usd"
# Price of one agent credit above the allowance, and what one credit is worth
# in model usage (provider list price plus margin).
credit_price_cents = 1
model_markup_percent = 30
# Hard cap per agent verification run.
credits_per_run_limit = 500
storage_overage_cents_per_gb = 10

[[plan]]
id = "free"
name = "Free"
price_cents = 0
per_person = false
max_people = 3
max_private_repos = 5
storage_gb = 2
storage_gb_per_person = 0
agent_credits = 100
agent_credits_per_person = 0
merge_queue = false
sso = false
pitr_days = 7
support = "community"

