apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hebra.fullname" . }}-server
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
  {{- with .Values.server.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hebra.fullname" . }}-web
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
automountServiceAccountToken: false
