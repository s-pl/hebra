{{- $name := printf "%s-web" (include "hebra.fullname" .) -}}
{{- $server := printf "%s-server" (include "hebra.fullname" .) -}}
{{- $ctx := dict "root" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "hebra.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hebra.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "hebra.podSecurity" . | nindent 6 }}
      {{- include "hebra.spread" $ctx | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: {{ include "hebra.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "hebra.containerSecurity" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: HEBRA_SERVER_URL, value: "{{ include "hebra.serverScheme" . }}://{{ $server }}:4600" }
            {{- if .Values.server.tls.enabled }}
            # Trust the internal CA that signed the servers' certificates.
            - { name: NODE_EXTRA_CA_CERTS, value: /secrets/ca/ca.crt }
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.server.tls.enabled }}
            - { name: ca, mountPath: /secrets/ca, readOnly: true }
            {{- end }}
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if .Values.server.tls.enabled }}
        # Only the CA certificate, never the servers' private key.
        - name: ca
          secret:
            secretName: {{ $server }}-tls
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "hebra.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http, appProtocol: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "hebra.selector" $ctx | nindent 6 }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "hebra.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
