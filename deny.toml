# cargo-deny: licenses, security advisories and dependency sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained. It only runs at compile time, inside
    # biscuit-auth's datalog macros, and nothing replaces it upstream yet.
    { id = "RUSTSEC-2026-0173", reason = "compile-time only, via biscuit-quote; no maintained alternative upstream" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
