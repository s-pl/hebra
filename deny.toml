# cargo-deny: licenses, security advisories and dependency sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained. It only runs at compile time, inside
    # biscuit-auth's datalog macros, and nothing replaces it upstream yet.
    { id = "RUSTSEC-2026-0173", reason = "compile-time only, via biscuit-quote; no maintained alternative upstream" },
    # crypto-bigint 0.5 comes with biscuit-auth's P-256 support, and 6.0.0 is its
    # latest release. The timing issue needs secret P-256 keys in that code:
    # Hebra only signs with Ed25519 (crates/mandate), so none ever reach it.
    { id = "RUSTSEC-2026-0387", reason = "P-256 only; Hebra's secret keys are Ed25519" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
